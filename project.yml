name: FocusBrowser

options:
  bundleIdPrefix: ch.louissaillen
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K5VQNR82Z9

targets:
  FocusBrowser:
    type: application
    platform: iOS
    sources:
      - path: FocusBrowser
        type: syncedFolder
    info:
      path: FocusBrowser/Info.plist
      properties:
        CFBundleDisplayName: Focus
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.louissaillen.focusbrowser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  FocusBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FocusBrowserTests
        type: syncedFolder
    dependencies:
      - target: FocusBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.louissaillen.focusbrowser.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FocusBrowser.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FocusBrowser"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  FocusBrowser:
    build:
      targets:
        FocusBrowser: all
    test:
      targets:
        - FocusBrowserTests
